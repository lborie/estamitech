runtime: go123

handlers:
  - url: /static/(.*\.(png|jpg|ico))$
    static_files: static/\1
    upload: static/.*\.(png|jpg|ico)$
    secure: always
    redirect_http_response_code: 301

  - url: /(.*\.(css|js))$
    static_files: web/\1
    upload: web/.*\.(css|js)$
    secure: always
    redirect_http_response_code: 301

  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301